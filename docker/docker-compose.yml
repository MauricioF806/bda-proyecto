# Nombre fijo del proyecto: sin esto Docker usa el nombre de la carpeta ("docker")
# y lo mezcla con cualquier otro proyecto que viva en una carpeta "docker"
name: bda-proyecto

services:
  tablespaces-init:
    image: busybox:1.36
    container_name: empleados-tablespaces-init
    user: root
    # 999:999 es el usuario postgres de la imagen oficial
    command: >
      sh -c "mkdir -p /ts/ts_datos /ts/ts_historico /ts/ts_indices /ts/ts_auditoria &&
             chown -R 999:999 /ts && chmod -R 700 /ts"
    volumes:
      - empleados_tablespaces:/ts

  postgres:
    image: postgres:16
    container_name: empleados-postgres
    restart: unless-stopped
    depends_on:
      tablespaces-init:
        condition: service_completed_successfully
    # log_line_prefix agrega usuario y base a cada línea del log: así quedan registrados
    # quién intentó cada operación rechazada (permission denied)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "log_line_prefix=%m [%p] %u@%d "]
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: empleados_db
      POSTGRES_USER: admin_empleados
    ports:
      - "5433:5432"
    volumes:
      - empleados_pgdata:/var/lib/postgresql/data
      - empleados_tablespaces:/var/lib/postgresql/tablespaces
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - empleados_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_empleados -d empleados_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mantenimiento automático (Fase 4): ejecuta scripts/15_mantenimiento_automatico.sql al arrancar
  # y luego cada MANTENIMIENTO_INTERVALO_SEG segundos (equivalente a un job de DBMS_SCHEDULER).
  # Se conecta por red como admin_empleados con la contraseña del .env.
  mantenimiento:
    image: postgres:16
    container_name: empleados-mantenimiento
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      PGHOST: postgres
      PGUSER: admin_empleados
      PGDATABASE: empleados_db
      MANTENIMIENTO_INTERVALO_SEG: "86400"
      # Descomentar para activar el truncado automático de los años fuera de la retención:
      # MANTENIMIENTO_RETENCION_ANIOS: "4"
    volumes:
      - ../scripts:/scripts:ro
    networks:
      - empleados_network
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        until pg_isready -q; do sleep 5; done
        while true; do
          echo "=== Mantenimiento automático: $$(date) ==="
          psql -X -f /scripts/15_mantenimiento_automatico.sql
          echo "=== Próxima corrida en $$MANTENIMIENTO_INTERVALO_SEG s ==="
          sleep "$$MANTENIMIENTO_INTERVALO_SEG"
        done

volumes:
  empleados_pgdata:
  empleados_tablespaces:

networks:
  empleados_network:
    name: empleados_network
    driver: bridge
